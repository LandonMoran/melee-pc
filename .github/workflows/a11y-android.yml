name: Build Android APK (accessibility fork)

# The fork's Android build on its own: a device APK should not wait on the
# desktop, iOS and browser jobs in build.yml, and those cost far more runner
# minutes. Start it by hand from Actions -> this workflow -> Run workflow, or
# with the REST API (workflow_dispatch). The build steps are the ones in
# build.yml's android job; keep the two in step when either changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The decomp needs scalar_storage_order, which the NDK's Clang does
          # not implement, so tools/gcc_launcher.py routes melee_game through
          # this cross compiler with the NDK sysroot.
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake gcc-aarch64-linux-gnu
          # nod has no Android prebuilt, so aurora builds it from Rust source.
          rustup target add aarch64-linux-android
          # aurora uses std::jthread/std::stop_token, which the runner's
          # newest NDK libc++ does not expose. r26 is the version this port
          # is developed against.
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;26.3.11579264' > /dev/null

      - name: Build APK
        env:
          MELEE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MELEE_KEYSTORE_BASE64: ${{ secrets.MELEE_KEYSTORE_BASE64 }}
          MELEE_KEYSTORE_PASSWORD: ${{ secrets.MELEE_KEYSTORE_PASSWORD }}
          MELEE_KEY_ALIAS: ${{ secrets.MELEE_KEY_ALIAS }}
          MELEE_KEY_PASSWORD: ${{ secrets.MELEE_KEY_PASSWORD }}
          # Without a release key the APK is signed with a throwaway one
          # (src/pc/a11y/a11y.cmake labels such a build "local build" unless
          # told otherwise, so name the commit here).
          MELEE_THROWAWAY_KEY: ${{ secrets.MELEE_KEYSTORE_BASE64 == '' && github.ref_type != 'tag' && '1' || '' }}
        run: |
          export MELEE_A11Y_BUILD_LABEL="dev build ${GITHUB_SHA::7}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.3.11579264"
          tools/build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-a11y
          path: dist/Melee-Android-arm64.apk
          if-no-files-found: error
